<body data-page="collecte">
  <a href="#main" class="skip-link">Skip to content</a>
  <nav id="site-nav"></nav>

  <main id="main" class="container">
    <div class="collecte-container">
      <div class="collecte-card reveal is-visible">
        <h2 style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px;" id="collecte-title">Espace de Collecte</h2>
        <p class="section-text" style="font-size: 15px; margin-bottom: 32px; color: var(--text-muted);">Saisissez le code secret de commande qui vous a été transmis pour récupérer vos créations et fichiers finaux.</p>
        
        <form id="collecte-form" novalidate aria-labelledby="collecte-title">
          <label for="collecte-code" class="visually-hidden">Code de collecte</label>
          <input type="text" id="collecte-code" class="collecte-input" placeholder="CODE-EXEMPLE" autocomplete="off" aria-required="true" aria-describedby="collecte-help" />
          <span id="collecte-help" class="visually-hidden">Entrez le code secret qui vous a été transmis pour récupérer vos fichiers</span>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Accéder à mes créations</button>
        </form>

        <p id="collecte-status" class="delivery-status" aria-live="polite" role="status"></p>

        <!-- Unlocked Delivery Box -->
        <div id="delivery-box" class="delivery-box">
          <div class="delivery-header">
            <h3 id="delivery-client" class="delivery-title">Créations de Moke</h3>
            <p id="delivery-date" class="delivery-meta">Livré le 20 mai 2026</p>
            <p id="delivery-notes" class="section-text" style="font-size: 14px; margin-bottom: 20px; line-height: 1.5; color: var(--text-muted);"></p>
          </div>

          <h4 style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 12px;">Fichiers prêts au retrait :</h4>
          <ul id="delivery-files" class="delivery-file-list">
            <!-- Files injected here -->
          </ul>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <div id="cmdk"></div>

  <script src="components.js"></script>
  <!-- Firebase Integration (App & Firestore) -->
