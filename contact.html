  <main>
    <section class="section page">
      <div class="container narrow center">
        <h2 class="section-title reveal" data-i18n="contact.title" id="contact-title">Travaillons ensemble</h2>
        <p class="section-text reveal" data-i18n="contact.text">Un projet, une idée, ou simplement envie d'échanger ?</p>

        <form id="contact-form-public" class="contact-form reveal" novalidate aria-labelledby="contact-title">
          <div class="form-row">
            <div class="form-field">
              <label for="cf-name" data-i18n="contact.name">Nom</label>
              <input type="text" id="cf-name" name="name" required autocomplete="name" aria-required="true" />
            </div>
            <div class="form-field">
              <label for="cf-email">Email</label>
              <input type="email" id="cf-email" name="email" required autocomplete="email" aria-required="true" />
            </div>
          </div>
          <div class="form-field">
            <label for="cf-subject" data-i18n="contact.subject">Sujet</label>
            <input type="text" id="cf-subject" name="subject" aria-required="false" />
          </div>
          <div class="form-field">
            <label for="cf-message" data-i18n="contact.message">Message</label>
            <textarea id="cf-message" name="message" rows="5" required aria-required="true"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="contact.send">Envoyer →</button>
          <p id="cf-status" class="contact-status" aria-live="polite" role="status"></p>
        </form>

        <p class="contact-or reveal" data-i18n="contact.or">— ou sur WhatsApp direct —</p>
